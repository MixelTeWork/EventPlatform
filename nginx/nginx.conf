events {
	worker_connections 1024;
	multi_accept on;
}
worker_processes auto;

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	server_tokens off;
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;

	gzip on;
	gzip_comp_level 5;
	gzip_min_length 256;
	gzip_vary on;
	gzip_proxied any;
	gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

	client_max_body_size 10M;

	limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
	limit_req_zone $binary_remote_addr zone=high_speed:10m rate=50r/s;

	upstream flask_app {
		server app:8000;
		keepalive 32;
	}

	server {
		listen 80;
		server_name _;
		root /usr/share/nginx/html;

		# Security headers
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;

		# Proxy defaults (HTTP/1.1 for keepalive)
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_connect_timeout 5s;
		proxy_send_timeout 30s;
		proxy_read_timeout 30s;

		location /live-timetable-api {
			limit_req zone=api burst=20 nodelay;

			# Handle preflight (OPTIONS) requests locally without reaching upstream
			if ($request_method = 'OPTIONS') {
				add_header 'Access-Control-Allow-Origin' '$http_origin' always;
				add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
				add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
				add_header 'Access-Control-Max-Age' 1728000 always;
				add_header 'Content-Type' 'text/plain; charset=utf-8' always;
				add_header 'Content-Length' 0 always;
				return 204;
			}

			# Strip upstream CORS headers to avoid duplication or conflicts
			proxy_hide_header Access-Control-Allow-Origin;
			proxy_hide_header Access-Control-Allow-Methods;
			proxy_hide_header Access-Control-Allow-Headers;
			proxy_hide_header Access-Control-Allow-Credentials;

			# Inject permissive CORS headers for actual requests
			add_header 'Access-Control-Allow-Origin' '$http_origin' always;
			add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
			add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
			add_header 'Access-Control-Allow-Credentials' 'false' always;

			# Strip client cookies so they are never sent upstream to festq.ru
    		proxy_set_header Cookie "";
			# Hide any Set-Cookie response headers sent back by the external API
			proxy_hide_header Set-Cookie;

			proxy_pass https://festq.ru/api/v1/shows;

			# Override default Host header to match the target domain (required for SNI/TLS)
			proxy_set_header Host festq.ru;
			proxy_ssl_server_name on;
		}

		location / {
			# try_files $uri $uri.html $uri/ /index.html;
			try_files $uri $uri.html $uri/ =404;
		}

		error_page 404 /404.html;

		location ~* \.(?:css|js|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot)$ {
			try_files $uri =404;
			expires 30d;
			access_log off;

			# Explicitly re-declare server headers here to prevent override loss
			add_header X-Frame-Options "SAMEORIGIN" always;
			add_header X-Content-Type-Options "nosniff" always;
			add_header Referrer-Policy "strict-origin-when-cross-origin" always;
			add_header Cache-Control "public, max-age=2592000, immutable";
		}

		location ~ ^/api/(tourney|game|click) {
			limit_req zone=high_speed burst=40 nodelay;
			proxy_pass http://flask_app;
		}

		location /api/ {
			limit_req zone=api burst=20 nodelay;
			proxy_pass http://flask_app;
		}
	}
}