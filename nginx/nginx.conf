# /etc/nginx/nginx.conf
events {
	worker_connections 1024;
	multi_accept on;
}
worker_processes auto;

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	server_tokens off;
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;

	gzip on;
	gzip_comp_level 5;
	gzip_min_length 256;
	gzip_vary on;
	gzip_proxied any;
	gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

	client_max_body_size 10M;

	limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
	limit_req_zone $binary_remote_addr zone=high_speed:10m rate=10r/s;

	# Instruct Nginx to look for the real IP in the X-Forwarded-For header
	real_ip_header X-Forwarded-For;

	# Trust proxy headers coming from any internal Docker network range
	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;

	# If there are multiple proxies, this ensures Nginx searches recursively
	# for the first untrusted (real client) IP address
	real_ip_recursive on;


	upstream flask_app {
		server app:8000;
		keepalive 32;
	}

	map $http_origin $cors_allowed_origin {
		default "";

		# "https://mixeltework.github.io" $http_origin;

		"~^https://([a-z0-9\-]+\.)?mysite\.ru$" $http_origin;
	}

	server {
		listen 80;
		server_name _;
		root /usr/share/nginx/html;

		# Security headers
		include /etc/nginx/snippets/security.conf;

		# Proxy defaults
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_connect_timeout 5s;
		proxy_send_timeout 30s;
		proxy_read_timeout 30s;

		location /live-timetable-api {
			limit_req zone=api burst=20 nodelay;

			include /etc/nginx/snippets/security.conf;
			include /etc/nginx/snippets/cors_external.conf;

			# Strip upstream CORS headers to avoid duplication or conflicts
			proxy_hide_header Access-Control-Allow-Origin;
			proxy_hide_header Access-Control-Allow-Methods;
			proxy_hide_header Access-Control-Allow-Headers;
			proxy_hide_header Access-Control-Allow-Credentials;

			# Strip client cookies so they are never sent upstream to festq.ru
			proxy_set_header Cookie "";
			# Hide any Set-Cookie response headers sent back by the external API
			proxy_hide_header Set-Cookie;

			proxy_pass https://festq.ru/api/v1/shows;

			# Override default Host header to match the target domain (required for SNI/TLS)
			proxy_set_header Host festq.ru;
			proxy_ssl_server_name on;
		}

		location / {
			# try_files $uri $uri.html $uri/ /index.html;
			try_files $uri $uri.html $uri/ =404;
		}

		error_page 404 /404.html;

		location ~* \.(?:css|js|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot)$ {
			try_files $uri =404;
			expires 30d;
			access_log off;

			include /etc/nginx/snippets/security.conf;
			add_header Cache-Control "public, max-age=2592000, immutable";
		}

		location ~ ^/api/(tourney|game|click) {
			limit_req zone=high_speed burst=40 nodelay;

			include /etc/nginx/snippets/security.conf;
			include /etc/nginx/snippets/cors.conf;
			include /etc/nginx/snippets/ip_forwarding.conf;

			proxy_pass http://flask_app;
		}

		location /api/ {
			limit_req zone=api burst=20 nodelay;

			include /etc/nginx/snippets/security.conf;
			include /etc/nginx/snippets/cors.conf;
			include /etc/nginx/snippets/ip_forwarding.conf;

			proxy_pass http://flask_app;
		}
	}
}